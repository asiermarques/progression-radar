# The Roles of the sample Ladder and the level each one requires in each Category.
# Category keys: build, ai, data, cloud, trust, agentic, deliv, biz, comm, people.
# A Category that a Role does not mention is level 0.

- key: assoc
  name: Associate
  levels: { build: 1, ai: 1, data: 1, cloud: 1, trust: 1, agentic: 1, deliv: 1, biz: 1, comm: 1 }

# Product Maker: builds products end to end, close to users, with AI as a multiplier.
- key: maker
  name: Product Maker
  levels: { build: 3, ai: 2, data: 1, cloud: 1, trust: 2, agentic: 3, deliv: 2, biz: 2, comm: 2, people: 1 }
- key: smaker
  name: Senior Product Maker
  levels: { build: 4, ai: 3, data: 2, cloud: 2, trust: 2, agentic: 4, deliv: 3, biz: 3, comm: 3, people: 2 }
- key: stmaker
  name: Staff Product Maker
  levels: { build: 5, ai: 3, data: 2, cloud: 2, trust: 3, agentic: 4, deliv: 4, biz: 4, comm: 4, people: 3 }

# AI Platform Engineer: builds the model and agent layer that product teams build on.
- key: aipe
  name: AI Platform Engineer
  levels: { build: 2, ai: 3, data: 2, cloud: 2, trust: 2, agentic: 3, deliv: 2, biz: 1, comm: 2, people: 1 }
- key: saipe
  name: Senior AI Platform Engineer
  levels: { build: 2, ai: 4, data: 3, cloud: 3, trust: 3, agentic: 4, deliv: 3, biz: 2, comm: 3, people: 2 }
- key: staipe
  name: Staff AI Platform Engineer
  levels: { build: 3, ai: 5, data: 3, cloud: 3, trust: 4, agentic: 4, deliv: 4, biz: 3, comm: 4, people: 3 }

# Data Platform Engineer: builds the data platform that people, products and AI rely on.
- key: dpe
  name: Data Platform Engineer
  levels: { build: 1, ai: 1, data: 3, cloud: 2, trust: 2, agentic: 2, deliv: 2, biz: 1, comm: 2, people: 1 }
- key: sdpe
  name: Senior Data Platform Engineer
  levels: { build: 1, ai: 2, data: 4, cloud: 3, trust: 3, agentic: 3, deliv: 3, biz: 2, comm: 3, people: 2 }
- key: stdpe
  name: Staff Data Platform Engineer
  levels: { build: 2, ai: 3, data: 5, cloud: 3, trust: 4, agentic: 4, deliv: 4, biz: 3, comm: 4, people: 3 }

# Cloud Platform Engineer: builds compute, deployment and safe environments for people and agents.
- key: cpe
  name: Cloud Platform Engineer
  levels: { build: 1, ai: 1, data: 1, cloud: 3, trust: 2, agentic: 2, deliv: 2, biz: 1, comm: 2, people: 1 }
- key: scpe
  name: Senior Cloud Platform Engineer
  levels: { build: 1, ai: 2, data: 2, cloud: 4, trust: 3, agentic: 3, deliv: 3, biz: 1, comm: 3, people: 2 }
- key: stcpe
  name: Staff Cloud Platform Engineer
  levels: { build: 2, ai: 3, data: 2, cloud: 5, trust: 4, agentic: 4, deliv: 4, biz: 2, comm: 4, people: 3 }

# Product Engineering Manager: grows the people of a team, owns its outcomes and redesigns how it works with agents.
- key: pem
  name: Product Engineering Manager
  levels: { build: 3, ai: 2, data: 2, cloud: 2, trust: 2, agentic: 4, deliv: 3, biz: 4, comm: 4, people: 4 }

# Product Engineering Director: owns the strategy and the outcomes of several areas, and reorganises them around agents.
- key: ped
  name: Product Engineering Director
  levels: { build: 2, ai: 3, data: 2, cloud: 2, trust: 3, agentic: 5, deliv: 4, biz: 5, comm: 5, people: 5 }
