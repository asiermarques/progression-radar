  levels: { build: 2, ai: 3, data: 2, cloud: 5, trust: 5, agentic: 4, deliv: 4, biz: 3, comm: 4, people: 3 }

# Product Engineering Manager: grows the people of several small teams, owns their outcomes and redesigns how they work with agents.
- key: pem
  name: Product Engineering Manager (L4)
  levels: { build: 3, ai: 2, data: 2, cloud: 2, trust: 3, agentic: 4, deliv: 4, biz: 4, comm: 4, people: 4 }

